. <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">

<title>JobMate</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    padding-bottom: 85px;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #4338ca, #6366f1);
    color: white;
    padding: 22px 18px 30px;
    border-radius: 0 0 28px 28px;
}

.header-top {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #c7d2fe;
}

.profile-mini {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: white;
    color: #4f46e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    border: 3px solid rgba(255,255,255,.35);
}

.welcome {
    max-width: 1000px;
    margin: 25px auto 0;
}

.welcome h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: -.5px;
}

.welcome p {
    margin: 8px 0 0;
    opacity: .9;
    font-size: 14px;
}

/* CONTENT */

.content {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 18px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 5px 20px rgba(31,41,55,.06);
}

.stat-icon {
    font-size: 22px;
}

.stat p {
    margin: 9px 0 0;
    color: #6b7280;
    font-size: 12px;
}

.stat strong {
    display: block;
    margin-top: 4px;
    font-size: 28px;
    color: #4f46e5;
}

/* CARDS */

.card {
    background: white;
    border-radius: 20px;
    padding: 18px;
    margin-top: 18px;
    box-shadow: 0 5px 20px rgba(31,41,55,.06);
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}

.card-title h2 {
    margin: 0;
    font-size: 19px;
}

/* BUTTONS */

.primary {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px 17px;
    border-radius: 12px;
    font-weight: 700;
}

.primary:hover {
    background: #4338ca;
}

.secondary {
    background: #eef2ff;
    color: #4f46e5;
    border: none;
    padding: 12px 17px;
    border-radius: 12px;
    font-weight: 600;
}

/* SEARCH */

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #e1e5ec;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
    margin-bottom: 10px;
    background: #fafbff;
}

.search:focus,
.filter:focus,
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}

.filter {
    width: 100%;
    padding: 13px;
    border: 1px solid #e1e5ec;
    border-radius: 12px;
    background: white;
    outline: none;
}

/* APPLICATION */

.application {
    border: 1px solid #e8ebf1;
    border-radius: 16px;
    padding: 16px;
    margin-top: 12px;
}

.application-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.application h3 {
    margin: 0;
    font-size: 16px;
}

.company {
    color: #6b7280;
    font-size: 13px;
    margin-top: 5px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.status-Applied {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-Interview {
    background: #fef3c7;
    color: #92400e;
}

.status-Offer {
    background: #dcfce7;
    color: #166534;
}

.status-Rejected {
    background: #fee2e2;
    color: #991b1b;
}

.details {
    margin-top: 12px;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.7;
}

.actions {
    margin-top: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.small-btn {
    border: none;
    padding: 8px 11px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
}

.edit {
    background: #fef3c7;
    color: #92400e;
}

.delete {
    background: #fee2e2;
    color: #991b1b;
}

.favorite {
    background: #f3f4f6;
}

.open-job {
    background: #eef2ff;
    color: #4f46e5;
    display: inline-block;
    text-decoration: none;
}

/* FORMS */

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d9dde6;
    border-radius: 11px;
    font-size: 14px;
    outline: none;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.form-buttons {
    display: flex;
    gap: 8px;
}

/* PROFILE */

.profile {
    text-align: center;
}

.avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg,#4f46e5,#818cf8);
    color: white;
    margin: 5px auto 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    font-weight: 800;
}

.profile h2 {
    margin: 0;
}

.profile-email {
    color: #6b7280;
    margin: 6px 0 18px;
    font-size: 14px;
}

.bio {
    background: #f6f7fb;
    padding: 15px;
    border-radius: 13px;
    text-align: left;
    line-height: 1.6;
    margin-bottom: 22px;
    color: #4b5563;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 38px 10px;
    color: #6b7280;
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 8px;
}

/* NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
}

.nav-item {
    border: none;
    background: transparent;
    color: #7b8190;
    font-size: 11px;
    text-align: center;
    padding: 6px 12px;
}

.nav-icon {
    display: block;
    font-size: 21px;
    margin-bottom: 3px;
}

.nav-item.active {
    color: #4f46e5;
    font-weight: 800;
}

/* DESKTOP */

@media (min-width: 768px) {

    .app {
        padding-bottom: 25px;
    }

    .stats {
        grid-template-columns: repeat(4, 1fr);
    }

    .bottom-nav {
        position: static;
        max-width: 1000px;
        margin: 20px auto;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="header-top">

        <div class="logo">
            Job<span>Mate</span>
        </div>

        <button
            class="profile-mini"
            id="miniAvatar"
            onclick="showProfile()">
            J
        </button>

    </div>

    <div class="welcome">

        <h1 id="welcomeText">
            Welcome to JobMate 👋
        </h1>

        <p>
            Your personal job application tracker.
        </p>

    </div>

</header>

<main class="content">

<section id="dashboard">

    <div class="stats">

        <div class="stat">
            <div class="stat-icon">📋</div>
            <p>Total Applications</p>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <div class="stat-icon">🎤</div>
            <p>Interviews</p>
            <strong id="interviews">0</strong>
        </div>

        <div class="stat">
            <div class="stat-icon">🎉</div>
            <p>Offers</p>
            <strong id="offers">0</strong>
        </div>

        <div class="stat">
            <div class="stat-icon">⭐</div>
            <p>Favorites</p>
            <strong id="favorites">0</strong>
        </div>

    </div>

    <div class="card">

        <div class="card-title">

            <h2 id="applicationsTitle">
                My Applications
            </h2>

            <button
                class="primary"
                onclick="openAdd()">
                + Add
            </button>

        </div>

        <input
            class="search"
            id="search"
            placeholder="🔎 Search jobs or companies..."
            oninput="render()">

        <select
            class="filter"
            id="filter"
            onchange="render()">

            <option value="All">All statuses</option>
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>

        </select>

        <div id="applications"></div>

    </div>

</section>

<section id="formPage" style="display:none">

    <div class="card">

        <div class="card-title">

            <h2 id="formTitle">
                Add Application
            </h2>

        </div>

        <div class="form-group">
            <label>Job Title</label>
            <input id="jobTitle" placeholder="e.g. Virtual Assistant">
        </div>

        <div class="form-group">
            <label>Company</label>
            <input id="company" placeholder="e.g. ABC Company">
        </div>

        <div class="form-group">
            <label>Status</label>

            <select id="status">
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
            </select>
        </div>

        <div class="form-group">
            <label>Application Date</label>
            <input type="date" id="applicationDate">
        </div>

        <div class="form-group">
            <label>Interview Date</label>
            <input type="date" id="interviewDate">
        </div>

        <div class="form-group">
            <label>Job Link</label>
            <input id="jobLink" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea id="notes" placeholder="Add notes..."></textarea>
        </div>

        <div class="form-buttons">

            <button class="primary" onclick="saveJob()">
                Save
            </button>

            <button class="secondary" onclick="showDashboard()">
                Cancel
            </button>

        </div>

    </div>

</section>

<section id="profilePage" style="display:none">

    <div class="card profile">

        <div class="avatar" id="avatar">
            J
        </div>

        <h2 id="profileDisplayName">
            Your Name
        </h2>

        <div class="profile-email" id="profileDisplayEmail">
            your@email.com
        </div>

        <div class="bio" id="profileDisplayBio">
            Add your professional bio here.
        </div>

        <h2 style="text-align:left">
            Edit Profile
        </h2>

        <div class="form-group" style="text-align:left">
            <label>Your Name</label>
            <input id="nameInput" placeholder="Your full name">
        </div>

        <div class="form-group" style="text-align:left">
            <label>Email</label>
            <input
                type="email"
                id="emailInput"
                placeholder="your@email.com">
        </div>

        <div class="form-group" style="text-align:left">
            <label>Professional Bio</label>
            <textarea
                id="bioInput"
                placeholder="Tell us about yourself..."></textarea>
        </div>

        <button
            class="primary"
            onclick="saveProfile()">
            💾 Save Profile
        </button>

    </div>

</section>

</main>

<nav class="bottom-nav">

    <button
        class="nav-item active"
        id="homeNav"
        onclick="showDashboard()">
        <span class="nav-icon">🏠</span>
        Home
    </button>

    <button
        class="nav-item"
        id="addNav"
        onclick="openAdd()">
        <span class="nav-icon">➕</span>
        Add Job
    </button>

    <button
        class="nav-item"
        id="favoritesNav"
        onclick="showFavorites()">
        <span class="nav-icon">⭐</span>
        Favorites
    </button>

    <button
        class="nav-item"
        id="profileNav"
        onclick="showProfile()">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</nav>

</div>

<script>

let jobs =
    JSON.parse(localStorage.getItem("jobmateJobs")) || [];

let profile =
    JSON.parse(localStorage.getItem("jobmateProfile")) || {
        name: "",
        email: "",
        bio: ""
    };

let editingId = null;
let favoritesOnly = false;


/* NAVIGATION */

function hideAll() {

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("formPage").style.display = "none";
    document.getElementById("profilePage").style.display = "none";
}

function showDashboard() {

    hideAll();

    document.getElementById("dashboard").style.display = "block";

    favoritesOnly = false;

    setActive("homeNav");

    document.getElementById("applicationsTitle").textContent =
        "My Applications";

    render();
    updateStats();

    window.scrollTo(0,0);
}

function openAdd() {

    hideAll();

    document.getElementById("formPage").style.display = "block";

    document.getElementById("formTitle").textContent =
        editingId
        ? "Edit Application"
        : "Add Application";

    setActive("addNav");

    window.scrollTo(0,0);
}

function showFavorites() {

    hideAll();

    document.getElementById("dashboard").style.display = "block";

    favoritesOnly = true;

    setActive("favoritesNav");

    document.getElementById("applicationsTitle").textContent =
        "Favorite Jobs ⭐";

    render();

    window.scrollTo(0,0);
}

function showProfile() {

    hideAll();

    document.getElementById("profilePage").style.display = "block";

    setActive("profileNav");

    loadProfile();

    window.scrollTo(0,0);
}

function setActive(id) {

    document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.remove("active");
    });

    if (id) {
        const button = document.getElementById(id);
        if (button) {
            button.classList.add("active");
        }
    }
}


/* APPLICATIONS */

function saveJob() {

    const title =
        document.getElementById("jobTitle").value.trim();

    const company =
        document.getElementById("company").value.trim();

    if (!title || !company) {

        alert("Please enter the job title and company.");

        return;
    }

    const oldJob =
        jobs.find(j => j.id === editingId);

    const job = {

        id: editingId || Date.now(),

        title: title,

        company: company,

        status:
            document.getElementById("status").value,

        applicationDate:
            document.getElementById("applicationDate").value,

        interviewDate:
            document.getElementById("interviewDate").value,

        link:
            document.getElementById("jobLink").value.trim(),

        notes:
            document.getElementById("notes").value.trim(),

        favorite:
            oldJob ? oldJob.favorite : false
    };

    if (editingId) {

        jobs = jobs.map(j =>
            j.id === editingId ? job : j
        );

    } else {

        jobs.unshift(job);
    }

    localStorage.setItem(
        "jobmateJobs",
        JSON.stringify(jobs)
    );

    editingId = null;

    clearForm();

    showDashboard();
}

function clearForm() {

    document.getElementById("jobTitle").value = "";
    document.getElementById("company").value = "";
    document.getElementById("status").value = "Applied";
    document.getElementById("applicationDate").value = "";
    document.getElementById("interviewDate").value = "";
    document.getElementById("jobLink").value = "";
    document.getElementById("notes").value = "";
}

function editJob(id) {

    const job =
        jobs.find(j => j.id === id);

    if (!job) return;

    editingId = id;

    document.getElementById("jobTitle").value = job.title;
    document.getElementById("company").value = job.company;
    document.getElementById("status").value = job.status;
    document.getElementById("applicationDate").value =
        job.applicationDate || "";
    document.getElementById("interviewDate").value =
        job.interviewDate || "";
    document.getElementById("jobLink").value =
        job.link || "";
    document.getElementById("notes").value =
        job.notes || "";

    openAdd();
}

function deleteJob(id) {

    if (!confirm("Delete this application?")) {
        return;
    }

    jobs =
        jobs.filter(j => j.id !== id);

    localStorage.setItem(
        "jobmateJobs",
        JSON.stringify(jobs)
    );

    render();
    updateStats();
}

function toggleFavorite(id) {

    jobs = jobs.map(job => {

        if (job.id === id) {
            return {
                ...job,
                favorite: !job.favorite
            };
        }

        return job;
    });

    localStorage.setItem(
        "jobmateJobs",
        JSON.stringify(jobs)
    );

    render();
    updateStats();
}


/* RENDER */

function render() {

    const container =
        document.getElementById("applications");

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();

    const filter =
        document.getElementById("filter").value;

    const filtered =
        jobs.filter(job => {

            const searchMatch =
                job.title.toLowerCase().includes(search) ||
                job.company.toLowerCase().includes(search);

            const statusMatch =
                filter === "All" ||
                job.status === filter;

            const favoriteMatch =
                !favoritesOnly ||
                job.favorite;

            return (
                searchMatch &&
                statusMatch &&
                favoriteMatch
            );
        });

    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📂</div>
                <strong>
                    ${favoritesOnly
                        ? "No favorite jobs yet"
                        : "No applications yet"}
                </strong>
                <p>
                    ${favoritesOnly
                        ? "Tap ☆ on a job to add it to favorites."
                        : "Add a job to start tracking your job search."}
                </p>
            </div>
        `;

        return;
    }

    container.innerHTML =
        filtered.map(job => `

            <div class="application">

                <div class="application-top">

                    <div>
                        <h3>
                            ${safe(job.title)}
                        </h3>

                        <div class="company">
                            ${safe(job.company)}
                        </div>
                    </div>

                    <span class="status status-${safe(job.status)}">
                        ${safe(job.status)}
                    </span>

                </div>

                <div class="details">

                    📅 Applied:
                    ${safe(job.applicationDate || "Not specified")}

                    ${
                        job.interviewDate
                        ? `<br>🎤 Interview:
                           ${safe(job.interviewDate)}`
                        : ""
                    }

                    ${
                        job.notes
                        ? `<br>📝 ${safe(job.notes)}`
                        : ""
                    }

                </div>

                <div class="actions">

                    <button
                        class="small-btn favorite"
                        onclick="toggleFavorite(${job.id})">

                        ${job.favorite ? "⭐" : "☆"}

                    </button>

                    <button
                        class="small-btn edit"
                        onclick="editJob(${job.id})">

                        ✏️ Edit

                    </button>

                    <button
                        class="small-btn delete"
                        onclick="deleteJob(${job.id})">

                        🗑️ Delete

                    </button>

                    ${
                        job.link
                        ? `<a
                            class="small-btn open-job"
                            href="${safeAttr(job.link)}"
                            target="_blank"
                            rel="noopener noreferrer">
                            🔗 Open Job
                           </a>`
                        : ""
                    }

                </div>

            </div>

        `).join("");
}


/* STATS */

function updateStats() {

    document.getElementById("total").textContent =
        jobs.length;

    document.getElementById("interviews").textContent =
        jobs.filter(j => j.status === "Interview").length;

    document.getElementById("offers").textContent =
        jobs.filter(j => j.status === "Offer").length;

    document.getElementById("favorites").textContent =
        jobs.filter(j => j.favorite).length;
}


/* PROFILE */

function saveProfile() {

    const name =
        document.getElementById("nameInput").value.trim();

    const email =
        document.getElementById("emailInput").value.trim();

    const bio =
        document.getElementById("bioInput").value.trim();

    if (!name) {

        alert("Please enter your name.");

        return;
    }

    profile = {
        name: name,
        email: email,
        bio: bio
    };

    localStorage.setItem(
        "jobmateProfile",
        JSON.stringify(profile)
    );

    loadProfile();

    alert("Profile saved successfully! 🎉");
}

function loadProfile() {

    const name =
        profile.name || "Your Name";

    const email =
        profile.email || "your@email.com";

    const bio =
        profile.bio ||
        "Add your professional bio here.";

    document.getElementById(
        "profileDisplayName"
    ).textContent = name;

    document.getElementById(
        "profileDisplayEmail"
    ).textContent = email;

    document.getElementById(
        "profileDisplayBio"
    ).textContent = bio;

    document.getElementById(
        "nameInput"
    ).value = profile.name || "";

    document.getElementById(
        "emailInput"
    ).value = profile.email || "";

    document.getElementById(
        "bioInput"
    ).value = profile.bio || "";

    const initial =
        name.charAt(0).toUpperCase();

    document.getElementById(
        "avatar"
    ).textContent = initial;

    document.getElementById(
        "miniAvatar"
    ).textContent = initial;

    document.getElementById(
        "welcomeText"
    ).textContent =
        profile.name
        ? "Welcome back, " +
          profile.name.split(" ")[0] +
          " 👋"
        : "Welcome to JobMate 👋";
}


/* SECURITY */

function safe(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function safeAttr(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/'/g,"&#039;");
}


/* START */

loadProfile();
render();
updateStats();

</script>
