
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMate</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

header {
    background: #4f46e5;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

header h1 {
    margin: 0;
}

main {
    max-width: 850px;
    margin: 25px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 9px;
    font-size: 15px;
    cursor: pointer;
    margin-right: 6px;
}

.delete-btn {
    background: #dc2626;
}

.edit-btn {
    background: #f59e0b;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

#form {
    display: none;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat {
    text-align: center;
    background: #eef2ff;
    padding: 18px;
    border-radius: 12px;
}

.stat strong {
    display: block;
    font-size: 28px;
    color: #4f46e5;
}

.application {
    background: #f5f7fb;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
}

.search-box {
    margin-bottom: 8px;
}

.no-results {
    color: #6b7280;
}
</style>
</head>

<body>

<header>
<h1>💼 JobMate</h1>
<p>Your job search, organised.</p>
</header>

<main>

<div class="card">
<h2>Welcome 👋</h2>
<p>Keep track of your job applications in one simple place.</p>

<button onclick="openAddForm()">➕ Add Application</button>
</div>

<div class="card" id="form">

<h2 id="formTitle">Add Application</h2>

<form onsubmit="saveJob(event)">

<label>Company</label>
<input id="company" required>

<label>Job Title</label>
<input id="title" required>

<label>Job Link</label>
<input id="link" type="url">

<label>Date Applied</label>
<input id="date" type="date" required>

<label>Status</label>
<select id="status">
<option>Applied</option>
<option>Interview</option>
<option>Offer</option>
<option>Rejected</option>
</select>

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit" id="saveButton">💾 Save Application</button>

<button type="button" onclick="closeForm()">Cancel</button>

</form>
</div>

<div class="card">

<h2>📊 Dashboard</h2>

<div class="stats">

<div class="stat">
<strong id="total">0</strong>
Applications
</div>

<div class="stat">
<strong id="interviews">0</strong>
Interviews
</div>

<div class="stat">
<strong id="offers">0</strong>
Offers
</div>

<div class="stat">
<strong id="rejected">0</strong>
Rejected
</div>

</div>
</div>

<div class="card">

<h2>📋 My Applications</h2>

<input
    class="search-box"
    id="search"
    type="text"
    placeholder="🔍 Search company or job title..."
    oninput="displayJobs()"
>

<select id="filter" onchange="displayJobs()">
<option value="All">All Applications</option>
<option value="Applied">Applied</option>
<option value="Interview">Interview</option>
<option value="Offer">Offer</option>
<option value="Rejected">Rejected</option>
</select>

<div id="jobs">
<p>No applications added yet.</p>
</div>

</div>

</main>

<script>

let applications = JSON.parse(
    localStorage.getItem("jobmateApplications") || "[]"
);

let editingIndex = -1;

function openAddForm() {

    editingIndex = -1;

    document.getElementById("formTitle").textContent =
        "Add Application";

    document.getElementById("saveButton").textContent =
        "💾 Save Application";

    document.getElementById("form").style.display = "block";

    document.getElementById("company").value = "";
    document.getElementById("title").value = "";
    document.getElementById("link").value = "";
    document.getElementById("date").value = "";
    document.getElementById("status").value = "Applied";
    document.getElementById("notes").value = "";

    window.scrollTo({
        top: document.getElementById("form").offsetTop,
        behavior: "smooth"
    });
}

function editJob(index) {

    const job = applications[index];

    editingIndex = index;

    document.getElementById("formTitle").textContent =
        "✏️ Edit Application";

    document.getElementById("saveButton").textContent =
        "💾 Update Application";

    document.getElementById("company").value = job.company;
    document.getElementById("title").value = job.title;
    document.getElementById("link").value = job.link;
    document.getElementById("date").value = job.date;
    document.getElementById("status").value = job.status;
    document.getElementById("notes").value = job.notes;

    document.getElementById("form").style.display = "block";

    window.scrollTo({
        top: document.getElementById("form").offsetTop,
        behavior: "smooth"
    });
}

function saveJob(event) {

    event.preventDefault();

    const job = {
        company: document.getElementById("company").value,
        title: document.getElementById("title").value,
        link: document.getElementById("link").value,
        date: document.getElementById("date").value,
        status: document.getElementById("status").value,
        notes: document.getElementById("notes").value
    };

    if (editingIndex === -1) {

        applications.push(job);

    } else {

        applications[editingIndex] = job;

        editingIndex = -1;
    }

    saveAndDisplay();

    closeForm();
}

function closeForm() {

    document.getElementById("form").style.display = "none";
}

function deleteJob(index) {

    if (confirm("Delete this application?")) {

        applications.splice(index, 1);

        saveAndDisplay();
    }
}

function saveAndDisplay() {

    localStorage.setItem(
        "jobmateApplications",
        JSON.stringify(applications)
    );

    displayJobs();
    updateDashboard();
}

function displayJobs() {

    const jobs = document.getElementById("jobs");

    const searchText =
        document.getElementById("search").value.toLowerCase();

    const filter =
        document.getElementById("filter").value;

    const filteredJobs = applications.filter(function(job) {

        const matchesSearch =
            job.company.toLowerCase().includes(searchText) ||
            job.title.toLowerCase().includes(searchText);

        const matchesFilter =
            filter === "All" || job.status === filter;

        return matchesSearch && matchesFilter;
    });

    if (filteredJobs.length === 0) {

        jobs.innerHTML =
            "<p class='no-results'>No matching applications found.</p>";

        return;
    }

    jobs.innerHTML = "";

    filteredJobs.forEach(function(job) {

        const originalIndex = applications.indexOf(job);

        const div = document.createElement("div");

        div.className = "application";

        div.innerHTML =
            "<h3>" + job.title + "</h3>" +
            "<p><strong>Company:</strong> " + job.company + "</p>" +
            "<p><strong>Date:</strong> " + job.date + "</p>" +
            "<p><strong>Status:</strong> " + job.status + "</p>" +
            "<p>" + job.notes + "</p>" +
            (job.link
                ? "<p><a href='" + job.link + "' target='_blank'>🔗 View Job</a></p>"
                : "") +
            "<button class='edit-btn' onclick='editJob(" +
            originalIndex +
            ")'>✏️ Edit</button>" +
            "<button class='delete-btn' onclick='deleteJob(" +
            originalIndex +
            ")'>🗑️ Delete</button>";

        jobs.appendChild(div);
    });
}

function updateDashboard() {

    document.getElementById("total").textContent =
        applications.length;

    document.getElementById("interviews").textContent =
        applications.filter(function(job) {
            return job.status === "Interview";
        }).length;

    document.getElementById("offers").textContent =
        applications.filter(function(job) {
            return job.status === "Offer";
        }).length;

    document.getElementById("rejected").textContent =
        applications.filter(function(job) {
            return job.status === "Rejected";
        }).length;
}

displayJobs();
updateDashboard();

</script>

</body>
</html>
