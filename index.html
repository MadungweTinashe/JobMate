<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMate</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

header {
    background: #4f46e5;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

header h1 {
    margin: 0;
}

main {
    max-width: 850px;
    margin: 25px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

.delete-btn {
    background: #dc2626;
    margin-top: 10px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

#form {
    display: none;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat {
    text-align: center;
    background: #eef2ff;
    padding: 18px;
    border-radius: 12px;
}

.stat strong {
    display: block;
    font-size: 28px;
    color: #4f46e5;
}

.application {
    background: #f5f7fb;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
<h1>💼 JobMate</h1>
<p>Your job search, organised.</p>
</header>

<main>

<div class="card">
<h2>Welcome 👋</h2>
<p>Keep track of your job applications in one simple place.</p>

<button onclick="document.getElementById('form').style.display='block'">
➕ Add Application
</button>
</div>

<div class="card" id="form">

<h2>Add Application</h2>

<form onsubmit="saveJob(event)">

<label>Company</label>
<input id="company" required>

<label>Job Title</label>
<input id="title" required>

<label>Job Link</label>
<input id="link" type="url">

<label>Date Applied</label>
<input id="date" type="date" required>

<label>Status</label>
<select id="status">
<option>Applied</option>
<option>Interview</option>
<option>Offer</option>
<option>Rejected</option>
</select>

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">💾 Save Application</button>

</form>
</div>

<div class="card">

<h2>📊 Dashboard</h2>

<div class="stats">

<div class="stat">
<strong id="total">0</strong>
Applications
</div>

<div class="stat">
<strong id="interviews">0</strong>
Interviews
</div>

<div class="stat">
<strong id="offers">0</strong>
Offers
</div>

<div class="stat">
<strong id="rejected">0</strong>
Rejected
</div>

</div>
</div>

<div class="card">

<h2>📋 My Applications</h2>

<div id="jobs">
<p>No applications added yet.</p>
</div>

</div>

</main>

<script>

let applications = JSON.parse(
    localStorage.getItem("jobmateApplications") || "[]"
);

function saveJob(event) {

    event.preventDefault();

    const job = {
        company: document.getElementById("company").value,
        title: document.getElementById("title").value,
        link: document.getElementById("link").value,
        date: document.getElementById("date").value,
        status: document.getElementById("status").value,
        notes: document.getElementById("notes").value
    };

    applications.push(job);

    saveAndDisplay();

    document.getElementById("form").style.display = "none";

    event.target.reset();
}

function deleteJob(index) {

    if (confirm("Delete this application?")) {

        applications.splice(index, 1);

        saveAndDisplay();
    }
}

function saveAndDisplay() {

    localStorage.setItem(
        "jobmateApplications",
        JSON.stringify(applications)
    );

    displayJobs();
    updateDashboard();
}

function displayJobs() {

    const jobs = document.getElementById("jobs");

    if (applications.length === 0) {

        jobs.innerHTML = "<p>No applications added yet.</p>";

        return;
    }

    jobs.innerHTML = "";

    applications.forEach(function(job, index) {

        const div = document.createElement("div");

        div.className = "application";

        div.innerHTML =
            "<h3>" + job.title + "</h3>" +
            "<p><strong>Company:</strong> " + job.company + "</p>" +
            "<p><strong>Date:</strong> " + job.date + "</p>" +
            "<p><strong>Status:</strong> " + job.status + "</p>" +
            "<p>" + job.notes + "</p>" +
            (job.link
                ? "<p><a href='" + job.link + "' target='_blank'>🔗 View Job</a></p>"
                : "") +
            "<button class='delete-btn' onclick='deleteJob(" + index + ")'>🗑️ Delete</button>";

        jobs.appendChild(div);
    });
}

function updateDashboard() {

    document.getElementById("total").textContent =
        applications.length;

    document.getElementById("interviews").textContent =
        applications.filter(function(job) {
            return job.status === "Interview";
        }).length;

    document.getElementById("offers").textContent =
        applications.filter(function(job) {
            return job.status === "Offer";
        }).length;

    document.getElementById("rejected").textContent =
        applications.filter(function(job) {
            return job.status === "Rejected";
        }).length;
}

displayJobs();
updateDashboard();

</script>

</body>
</html>
